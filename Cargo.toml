[package]
name = "git-forker"
version = "0.1.1"
edition = "2024"
description = "跨平台的本地 Git 客户端"
license = "MIT"

[dependencies]
arboard = { version = "3", default-features = false }
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.37.0"
git2 = "0.21.0"
lucide-icons = "1.78"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }
